<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Python Mini Game</title>
<style>
body{font-family:Arial,sans-serif;background:#eee8ff;margin:0;display:grid;place-items:center;min-height:100vh}
.card{background:white;width:min(92%,420px);padding:28px;border-radius:20px;text-align:center;box-shadow:0 8px 30px #0002}
h1{margin-top:0;color:#5b2bbf}.number{font-size:18px;padding:12px;width:80px}
button{padding:12px 18px;border:0;border-radius:10px;background:#6c3bd1;color:white;font-weight:bold;margin:8px;cursor:pointer}
#message{min-height:48px;font-size:18px}
small{color:#666}
</style>
</head>
<body>
<div class="card">
<h1>🎮 Guess the Number</h1>
<p>I'm thinking of a number from <b>1 to 20</b>.</p>
<input id="guess" class="number" type="number" min="1" max="20" placeholder="?">
<button onclick="play()">Guess</button>
<button onclick="resetGame()">New Game</button>
<p id="message">Loading Python…</p>
<small>Python powers the game in your browser.</small>
</div>
<script src="https://cdn.jsdelivr.net/pyodide/v0.27.7/full/pyodide.js"></script>
<script>
let pyodide, checkGuess, newGame;
async function start(){
  pyodide=await loadPyodide();
  const code=await (await fetch("game.py")).text();
  await pyodide.runPythonAsync(code);
  checkGuess=pyodide.globals.get("check_guess");
  newGame=pyodide.globals.get("new_game");
  document.getElementById("message").textContent="Python is ready! Make your first guess.";
}
async function play(){
  if(!checkGuess){return}
  const value=Number(document.getElementById("guess").value);
  if(!Number.isInteger(value)||value<1||value>20){
    document.getElementById("message").textContent="Enter a whole number from 1 to 20.";
    return;
  }
  const result=checkGuess(value);
  document.getElementById("message").textContent=result;
}
async function resetGame(){
  if(!newGame){return}
  newGame();
  document.getElementById("guess").value="";
  document.getElementById("message").textContent="New game! Guess a number from 1 to 20.";
}
start().catch(e=>document.getElementById("message").textContent="Could not load Python. Refresh and try again.");
</script>
</body>
</html>

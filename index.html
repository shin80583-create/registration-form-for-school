<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>🎮 Guess the Number</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Arial,sans-serif;background:linear-gradient(135deg,#eee8ff,#d9c8ff);padding:20px}.card{width:min(94vw,430px);background:#fff;padding:28px;border-radius:24px;text-align:center;box-shadow:0 12px 35px #4b238033}h1{color:#5b2bbf;margin:0 0 10px}.number{font-size:22px;width:100px;padding:10px;text-align:center;border:2px solid #bba4ee;border-radius:10px}button{border:0;border-radius:10px;padding:12px 16px;margin:8px 4px;background:#6c3bd1;color:white;font-weight:bold;font-size:15px}button:active{transform:scale(.97)}#message{min-height:52px;font-size:18px;font-weight:bold}.tries{color:#666}
</style></head>
<body><main class="card">
<h1>🎮 Guess the Number</h1><p>I'm thinking of a number from <b>1 to 20</b>.</p>
<input id="guess" class="number" type="number" min="1" max="20" inputmode="numeric" placeholder="?">
<div><button onclick="play()">Guess</button><button onclick="resetGame()">New Game</button></div>
<p id="message">Make your first guess!</p><p class="tries">Attempts: <span id="tries">0</span></p>
</main>
<script>
let secret=Math.floor(Math.random()*20)+1,attempts=0;
const $=id=>document.getElementById(id);
function play(){const n=Number($("guess").value);if(!Number.isInteger(n)||n<1||n>20){$("message").textContent="Enter a whole number from 1 to 20.";return}attempts++;$("tries").textContent=attempts;if(n<secret)$("message").textContent="⬆️ Too low! Try again.";else if(n>secret)$("message").textContent="⬇️ Too high! Try again.";else $("message").textContent="🎉 Correct! You won in "+attempts+" tries!";}
function resetGame(){secret=Math.floor(Math.random()*20)+1;attempts=0;$("tries").textContent=0;$("guess").value="";$("message").textContent="New game! Make your guess."}
$("guess").addEventListener("keydown",e=>{if(e.key==="Enter")play()});
</script></body></html>
